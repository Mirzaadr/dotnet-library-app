openapi: 3.0.1
info:
  title: Library Management System API
  version: v1
  description: API for managing books, borrowing, and users in a library system.

servers:
  - url: https://localhost:3001/api/v1

paths:
  /auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                username:
                  type: string
                password:
                  type: string
                role:
                  type: string
                  enum: [User, Librarian, Admin]
      responses:
        "200":
          description: User registered

  /auth/login:
    post:
      summary: Login and receive JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                properties:
                  token:
                    type: string

  /books:
    get:
      summary: Get all books
      responses:
        "200":
          description: List of books

    post:
      summary: Add a new book
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              properties:
                title:
                  type: string
                author:
                  type: string
                totalCopies:
                  type: integer
      responses:
        "200":
          description: Book added

  /books/{id}:
    get:
      summary: Get book by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Book details

    put:
      summary: Update book
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Book updated

    delete:
      summary: Delete book
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Book deleted

  /borrows:
    post:
      summary: Request to borrow a book
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              properties:
                bookId:
                  type: integer
      responses:
        "200":
          description: Borrow requested

    get:
      summary: Get all borrows
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of borrow records

  /borrows/mine:
    get:
      summary: Get current user's borrow records
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User's borrow history

  /borrows/{id}/pickup:
    put:
      summary: Confirm book pickup
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pickup confirmed

  /borrows/{id}/return:
    put:
      summary: Confirm book return
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Book returned

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
